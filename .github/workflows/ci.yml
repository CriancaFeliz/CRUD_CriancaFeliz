name: CI

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, fileinfo

      - name: PHP lint
        run: |
          find . \
            -path './database/legacy_dumps' -prune -o \
            -path './vendor' -prune -o \
            -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Automated tests
        run: php tests/run.php

      - name: Docker Compose config
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.test.yml config --quiet

      - name: Start test stack
        run: docker compose -f docker-compose.test.yml up -d --build

      - name: Wait for app
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8090/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.test.yml logs --no-color
          exit 1

      - name: Database integration tests
        run: |
          docker compose -f docker-compose.test.yml exec -T app php tests/wait_for_database.php
          docker compose -f docker-compose.test.yml exec -T app php tests/run_integration.php

      - name: HTTP smoke tests
        run: docker compose -f docker-compose.test.yml exec -T app php tests/run_http_smoke.php

      - name: Backup and restore test
        run: docker compose -f docker-compose.test.yml exec -T db sh -lc "tr -d '\r' < /backup_restore_check.sh | sh"

      - name: Test stack logs
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color

      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans
