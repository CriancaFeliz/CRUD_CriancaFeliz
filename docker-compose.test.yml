services:
  app:
    build:
      context: .
    container_name: criancafeliz_test_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: criancafeliz_test
      DB_USER: criancafeliz
      DB_PASS: criancafeliz
      DB_CHARSET: utf8mb4
      APP_DEBUG: "false"
      INITIAL_ADMIN_PASSWORD: "AlterarEstaSenha!2026"
      APP_BASE_URL: "http://localhost"
    ports:
      - "8090:80"
    volumes:
      - ./:/var/www/html

  db:
    image: mysql:8.4
    container_name: criancafeliz_test_db
    command:
      - --lower_case_table_names=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: criancafeliz_test
      MYSQL_USER: criancafeliz
      MYSQL_PASSWORD: criancafeliz
      MYSQL_ROOT_PASSWORD: root
      TZ: America/Sao_Paulo
    volumes:
      - db_test_data:/var/lib/mysql
      - ./docker/mysql/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./docker/mysql/02-missing-views.sql:/docker-entrypoint-initdb.d/02-missing-views.sql:ro
      - ./database/SETUP_COMPLETO_FINAL.sql:/docker-init/SETUP_COMPLETO_FINAL.sql:ro
      - ./tests/backup_restore_check.sh:/backup_restore_check.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_test_data:
