services:
  app:
    build:
      context: .
    container_name: criancafeliz_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: criancafeliz
      DB_USER: criancafeliz
      DB_PASS: ${MYSQL_APP_PASSWORD:-criancafeliz_dev}
      DB_CHARSET: utf8mb4
      APP_ENV: development
      APP_DEBUG: "false"
      APP_BASE_URL: http://localhost:8080
      SOCIAL_INCOME_REFERENCE: ${SOCIAL_INCOME_REFERENCE:-1621.00}
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html

  db:
    image: mysql:8.4
    container_name: criancafeliz_db
    command:
      - --lower_case_table_names=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: criancafeliz
      MYSQL_USER: criancafeliz
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-criancafeliz_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
      TZ: America/Sao_Paulo
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./database/schema_completo.sql:/docker-init/schema_completo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5
    container_name: criancafeliz_phpmyadmin
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
    ports:
      - "8081:80"

volumes:
  db_data:
